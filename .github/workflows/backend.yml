name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'

env:
  DOCKER_IMAGE: naero-backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix backend --omit=dev
      - run: npx eslint backend/src/
      - run: node backend/scripts/smoke.js

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile.backend -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
      - name: Verify image exists
        run: docker images --filter "reference=${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  # ── Deploy job (manual trigger or push to main/staging) ──────────
